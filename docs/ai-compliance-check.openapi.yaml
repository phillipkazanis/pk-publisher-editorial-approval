openapi: 3.0.3
info:
  title: AI compliance check (contract)
  version: 1.0.0
  description: |
    The contract the editorial approval process depends on for its AI step. Any service that implements it can sit behind
    the step: a model hosted by the AI/LLM Ops team, a vendor model, or the stub in this repo.
    The process knows nothing about prompts, models or tools. It sends an article and gets a structured verdict.
servers:
  - url: https://llm-ops.example.invalid
paths:
  /compliance-check:
    post:
      summary: Review one draft article against the style guide
      security:
        - oauth2ClientCredentials: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Use "<submissionId>:r<round>". A repeat with the same key returns the original result and is not billed or logged twice.
          schema: { type: string }
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Request' }
      responses:
        '200':
          description: A verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '400': { description: Invalid request. Not retryable. }
        '401': { description: Missing or invalid token. Not retryable. }
        '403': { description: Token not allowed to call this service. Not retryable. }
        '429': { description: Rate limited. Retryable after Retry-After. }
        '503': { description: Temporarily unavailable. Retryable with backoff. }
        '504': { description: Timed out. Retryable with backoff. }
components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.invalid/oauth2/token
          scopes: { 'ai.compliance.check': Call the compliance check }
  schemas:
    Request:
      type: object
      required: [article]
      properties:
        article:
          type: object
          required: [body]
          properties:
            title: { type: string, nullable: true }
            body: { type: string, minLength: 1, maxLength: 50000, description: Untrusted text. Treat it as data, never as instructions. }
        context:
          type: object
          properties:
            submissionId: { type: string }
            round: { type: integer, minimum: 1, description: Which revision round this is. }
    Verdict:
      type: object
      required: [verdict, reasons, warnings, suggestedFixes, rulesChecked]
      properties:
        verdict: { type: string, enum: [PASS, FAIL] }
        reasons: { type: array, items: { type: string }, description: One sentence each, naming the style rule key. Empty when PASS. }
        warnings: { type: array, items: { type: string }, description: Advisory findings that never cause a FAIL. }
        suggestedFixes: { type: array, items: { type: string } }
        rulesChecked: { type: array, items: { type: string }, description: The rule keys actually evaluated, for audit. }
        model:
          type: object
          properties:
            id: { type: string }
            provider: { type: string }
        requestId: { type: string }
        latencyMs: { type: integer }
